<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="reg.css">
</head>
<body>
 <div class="container">
        <h1 id="title">Create a new account </h1>
   
    <div class="regForm"> 
        <form id="regForm" method="GET" onsubmit="return validateForm(event)" >

        <label><span id="label-fname">First name</span> <input type="text" id="fname" name="firstname" placeholder="Enter your firstname"></label>
        <label ><span id="label-lname">Last name</span> <input type="text" id="lname" name="lastname" placeholder="Enter your  lastname"></label>
        <label ><span id="label-email">Email</span> <input type="email" id="email" name="email" placeholder="Enter your email"></label>
        <label ><span id="label-password">password</span> <input type="password" id="password" name="password" placeholder="Enter your password"></label>
        <label ><span id="label-confirm">Confirm-Password</span> <input type="password" id="confirm" name="password" placeholder="Confirm your password"></label>

        <span id="already-account">Already have an account? </span><a id="login-link" href="index.html">Log in</a>

        <button type="submit" id="regButton">Create Account</button>


    </form>
    </div>
 </div>

    
    <script src="valForm.js"></script>
    <script src="register-translation.js"></script>
        <script src="navbar.js"></script>
</body>
</html>
